name: Publish to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      GIST_ID: ${{ vars.GIST_ID }}

    outputs:
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      build_info: ${{ steps.metadata.outputs.build_info }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare build info
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DATE="$(
            TZ=Etc/GMT+3 \
              date '+%d/%m/%Y %H:%M:%S GMT-3'
          )"

          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_INFO="${BUILD_DATE} | commit ${GITHUB_SHA}"

          {
            echo "BUILD_INFO=${BUILD_INFO}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "SHORT_SHA=${SHORT_SHA}"
          } >> "$GITHUB_ENV"

          {
            echo "date=${BUILD_DATE}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_info=${BUILD_INFO}"
          } >> "$GITHUB_OUTPUT"

          echo "Build information:"
          echo "${BUILD_INFO}"

      - name: Build
        run: pnpm build

      - name: Vite build
        run: pnpm build:vite

      - name: Verify dist build
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "dist/roderuda.js"
            "dist/roderuda.min.js"
            "dist/roderuda.with-comments.js"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required build artifact does not exist"
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "::error file=${file}::Required build artifact is empty"
              exit 1
            fi
          done

          echo "Generated build artifacts:"

          for file in "${required_files[@]}"; do
            size="$(du -h "$file" | cut -f1)"
            echo "- ${file}: ${size}"
          done

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail

          jq \
            --null-input \
            --arg commit "${GITHUB_SHA}" \
            --arg commitShort "${SHORT_SHA}" \
            --arg builtAt "${BUILD_DATE}" \
            --arg timezone "GMT-3" \
            --arg buildInfo "${BUILD_INFO}" \
            '{
              commit: $commit,
              commitShort: $commitShort,
              builtAt: $builtAt,
              timezone: $timezone,
              buildInfo: $buildInfo
            }' > dist/build.json

          jq . dist/build.json

      - name: Prepare GitHub Pages directory
        shell: bash
        run: |
          set -euo pipefail

          pwd
          find . \( -path '*/node_modules' -o -path '*/.git' \) -prune -o -print | sed 's|[^/]*/|- |g'

          rm -rf pages
          mkdir -p pages/roderuda

          cp \
            dist/roderuda.js \
            dist/roderuda.min.js \
            dist/roderuda.with-comments.js \
            dist/build.json \
            pages/roderuda/

          optional_files=(
            "dist/roderuda.js.map"
            "dist/roderuda.min.js.map"
            "dist/roderuda.with-comments.js.map"
          )

          for file in "${optional_files[@]}"; do
            if [[ -f "$file" ]]; then
              cp "$file" pages/roderuda/
            fi
          done

          # This file must exist, but it is intentionally empty.
          touch pages/.nojekyll
        
          
           
          cp index.html pages/roderuda/index.html

      - name: Verify GitHub Pages directory
        shell: bash
        run: |
          set -euo pipefail

          required_non_empty_files=(
            "pages/index.html"
            "pages/roderuda/index.html"
            "pages/roderuda/roderuda.js"
            "pages/roderuda/roderuda.min.js"
            "pages/roderuda/roderuda.with-comments.js"
            "pages/roderuda/build.json"
          )

          required_existing_files=(
            "pages/.nojekyll"
          )

          for file in "${required_non_empty_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required Pages file does not exist"
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "::error file=${file}::Required Pages file is empty"
              exit 1
            fi
          done

          for file in "${required_existing_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required Pages marker does not exist"
              exit 1
            fi
          done

          echo "GitHub Pages directory contents:"

          find pages \
            -type f \
            -printf '%p (%s bytes)\n' \
            | sort

          echo
          echo "Total Pages directory size:"
          du -sh pages

          echo
          echo "Verified non-empty files:"

          for file in "${required_non_empty_files[@]}"; do
            size="$(du -h "$file" | cut -f1)"
            echo "- ${file}: ${size}"
          done

          echo
          echo "Verified marker files:"

          for file in "${required_existing_files[@]}"; do
            echo "- ${file}: exists and may be empty"
          done

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: pages/
          retention-days: 1
          include-hidden-files: true

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: roderuda-dist-${{ steps.metadata.outputs.short_sha }}
          path: |
            dist/roderuda.js
            dist/roderuda.min.js
            dist/roderuda.with-comments.js
            dist/roderuda.js.map
            dist/roderuda.min.js.map
            dist/roderuda.with-comments.js.map
            dist/build.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## 🌿 RodEruda deployed"
            echo
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build: ${{ needs.build.outputs.build_info }}"
          } >> "$GITHUB_STEP_SUMMARY"

  gist:
    name: Update Gist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - build
      - deploy

    permissions:
      contents: read

    env:
      GIST_ID: ${{ vars.GIST_ID }}
      GH_TOKEN: ${{ secrets.GIST_TOKEN }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: roderuda-dist-${{ needs.build.outputs.short_sha }}
          path: dist

      - name: Verify Gist configuration
        id: gist-config
        shell: bash
        run: |
          set -euo pipefail

          enabled=true

          if [[ -z "${GIST_ID:-}" ]]; then
            echo "::warning::GIST_ID repository variable is not configured"
            enabled=false
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::GIST_TOKEN repository secret is not configured"
            enabled=false
          fi

          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Update Gist
        if: steps.gist-config.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          jq \
            --null-input \
            --arg description \
              "RodEruda | ${{ needs.build.outputs.build_info }}" \
            --rawfile roderuda \
              dist/roderuda.js \
            --rawfile roderuda_min \
              dist/roderuda.min.js \
            --rawfile build \
              dist/build.json \
            '{
              description: $description,
              files: {
                "roderuda.js": {
                  content: $roderuda
                },
                "roderuda.min.js": {
                  content: $roderuda_min
                },
                "build.json": {
                  content: $build
                }
              }
            }' \
          | gh api \
              --method PATCH \
              "gists/${GIST_ID}" \
              --input -

          echo "Gist updated successfully"
