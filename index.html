<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>RodEruda</title>
    <style>
      :root {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(100%, 680px);
        padding: 24px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(24px, 6vw, 42px);
      }

      p {
        margin: 0;
        line-height: 1.65;
        opacity: 0.76;
      }

      code {
        font: inherit;
      }

      #status {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        font-size: 14px;
      }

      #status[data-state="ready"] {
        color: #22a06b;
      }

      #status[data-state="error"] {
        color: #d33c3c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RodEruda</h1>
      <p>
        Página mínima para validar o bundle local em
        <code>./roderuda/roderuda.js</code>.
      </p>
      <p id="status" role="status" aria-live="polite">Carregando RodEruda…</p>
    </main>

    <script src="./roderuda/roderuda.js"></script>
    <script>
      (() => {
        const status = document.getElementById('status');

        function setStatus(message, state) {
          status.textContent = message;
          status.dataset.state = state;
        }

        try {
          const api = window.RodEruda && (window.RodEruda.default || window.RodEruda);

          if (!api || typeof api.init !== 'function') {
            throw new TypeError(
              'O bundle foi carregado, mas window.RodEruda.init não está disponível.'
            );
          }

          api.init({
            autoScale: true,
            useShadowDom: true,
            inline: false,
          });

          api.show('console');
          window.RodEruda = api;

          console.log('🪅 RodEruda inicializado com sucesso.', {
            version: api.version,
            api,
          });

          setStatus(
            `RodEruda ${api.version || ''} inicializado. O painel Console foi aberto.`,
            'ready'
          );
        } catch (error) {
          console.error('[RodEruda bootstrap] Falha ao inicializar:', error);
          setStatus(`Falha ao inicializar: ${error.message}`, 'error');
        }
      })();
    </script>
  </body>
</html>
